[project]
name = "fruitfly-roblox"
version = "0.2.0"
description = "MaleCNS fruit-fly connectome seeing through a Roblox character and driving it."
requires-python = ">=3.11"
dependencies = [
  "flybrain>=0.1.0",
  "numpy>=2.0",
]

[project.scripts]
fruitfly-roblox = "fruitfly_roblox.__main__:main"
jev-roblox = "fruitfly_roblox.jev_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fruitfly_roblox"]
